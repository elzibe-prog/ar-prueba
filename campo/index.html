<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>CAMPO · ESTELA</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,sans-serif;color:#fff;background:#000;touch-action:none;-webkit-user-select:none;user-select:none}
  #out{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;display:block;background:#000}
  #vid{position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none}
  #inicio{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:#0b0a10}
  #inicio img{width:150px;margin-bottom:18px}
  #inicio p{font-size:14px;opacity:.75;max-width:340px;line-height:1.55;margin:0 0 22px}
  #btn{font-size:15px;padding:14px 30px;border-radius:999px;border:1.5px solid #fff;background:transparent;color:#fff;letter-spacing:.08em}
  #estado{margin-top:18px;font-size:12px;opacity:.6;min-height:16px}
  #chips{position:fixed;left:0;right:0;top:max(10px,env(safe-area-inset-top));z-index:6;display:none;justify-content:center;flex-wrap:wrap;gap:6px;padding:0 8px}
  #chips button{height:34px;padding:0 12px;border-radius:999px;border:1px solid #fff7;background:#0008;color:#fff;font-size:12px}
  #acciones{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));z-index:6;display:none;justify-content:center;align-items:center;gap:26px}
  .big{width:64px;height:64px;border-radius:50%;border:3px solid #fff;background:#fff2;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
  #bRec{background:#e0243a55}
  #bRec.on{background:#e0243a;animation:p 1s infinite}
  @keyframes p{50%{opacity:.6}}
  #modal{position:fixed;inset:0;z-index:30;background:#000d;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
  #modal .cont{max-width:92vw;max-height:68vh;display:flex}
  #modal img,#modal video{max-width:92vw;max-height:68vh;border-radius:10px}
  #modal .fila{display:flex;gap:10px}
  #modal button{height:44px;padding:0 20px;border-radius:999px;border:1px solid #fff;background:#fff1;color:#fff;font-size:14px}
  #modal button.pri{background:#fff;color:#000;font-weight:600}
  #msg{font-size:12px;opacity:.7;min-height:14px}
</style>
</head>
<body>
<canvas id="out"></canvas>
<video id="vid" playsinline muted></video>
<div id="chips">
  <button id="bCam">Cámara ↔</button>
  <button id="bPts">Estela: brazos</button>
  <button id="bLen">Largo: medio</button>
  <button id="bLook">Look: afiche</button>
  <button id="bEsq">Esqueleto: no</button>
</div>
<div id="acciones">
  <button class="big" id="bFoto">FOTO</button>
  <button class="big" id="bRec">REC</button>
</div>
<div id="modal">
  <div class="cont" id="cont"></div>
  <div class="fila"><button class="pri" id="mShare">Compartir</button><button id="mSave">Guardar</button><button id="mClose">Cerrar</button></div>
  <div id="msg"></div>
</div>
<div id="inicio">
  <img src="logo-campo-blanco.png" alt="CAMPO">
  <p>Filmá a un bailarín con la cámara del celular: sus brazos dejan una estela de colores.<br><br>Apoyá el celular, encuadrá el cuerpo entero con buena luz, y tocá <b>FOTO</b> o <b>REC</b>. Después podés compartirlo.<br><br>La cámara solo se usa para ver el movimiento. Nada se sube a ningún servidor.</p>
  <button id="btn">EMPEZAR</button>
  <div id="estado"></div>
</div>

<script type="module">
const $ = id => document.getElementById(id);
const out = $('out'), ctx = out.getContext('2d'), vid = $('vid'), estado = $('estado');

/* ===== recursos ===== */
const logo = new Image(); logo.src = 'logo-campo-blanco.png';
const grain = (() => { const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'), d = g.createImageData(256, 256);
  for (let i = 0; i < d.data.length; i += 4){ const v = 90 + Math.random() * 120; d.data[i] = d.data[i+1] = d.data[i+2] = v; d.data[i+3] = 255; } g.putImageData(d, 0, 0); return c; })();

/* ===== cámara ===== */
let facing = 'environment', mirror = false, stream = null, camOk = false;
async function iniciarCamara(){
  if (stream) stream.getTracks().forEach(t => t.stop());
  try { stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing}, width:{ideal:1280}, height:{ideal:720}}, audio:false}); }
  catch(e){ stream = await navigator.mediaDevices.getUserMedia({video:true, audio:false}); }
  vid.srcObject = stream; await vid.play();
  mirror = facing === 'user'; camOk = true; histories = {}; smooth = {};
}

/* ===== pose ===== */
let pose = null, lastVT = -1;
async function cargarPose(){
  const V = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
  const vis = await import(V + '/vision_bundle.mjs');
  const fs = await vis.FilesetResolver.forVisionTasks(V + '/wasm');
  const base = { modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task' };
  const opts = { runningMode:'VIDEO', numPoses:2 };
  try { pose = await vis.PoseLandmarker.createFromOptions(fs, {...opts, baseOptions:{...base, delegate:'GPU'}}); }
  catch(e){ pose = await vis.PoseLandmarker.createFromOptions(fs, {...opts, baseOptions:{...base, delegate:'CPU'}}); }
}

/* ===== estelas ===== */
const SETS = [ {n:'brazos', pts:[13,14,15,16,19,20]}, {n:'brazos y piernas', pts:[13,14,15,16,19,20,25,26,27,28]}, {n:'solo manos', pts:[15,16,19,20]} ];
const LIFES = [ {n:'corto', s:.7}, {n:'medio', s:1.4}, {n:'largo', s:2.4} ];
let setI = 0, lenI = 1, look = 1, esqueleto = false;
let histories = {}, smooth = {}, lastLM = [];
const BONES = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];

function actualizar(lms, now){
  lastLM = lms;
  lms.forEach((lm, p) => {
    for (const k of SETS[setI].pts){
      const key = p + '-' + k, q = lm[k], h = histories[key] || (histories[key] = []);
      if (!q || (q.visibility !== undefined && q.visibility < .4)){ if (h.length && h[h.length-1]) h.push(null); continue; }
      const x = (mirror ? 1 - q.x : q.x) * out.width, y = q.y * out.height;
      const s = smooth[key] || (smooth[key] = {x, y});
      s.x += (x - s.x) * .6; s.y += (y - s.y) * .6;
      h.push({x:s.x, y:s.y, t:now});
    }
  });
}
function colorAt(a){ return ((28 - a * 190) % 360 + 360) % 360; }   // naranja → rojo → magenta → azul
function dibujarEstelas(now){
  const life = LIFES[lenI].s * 1000, base = out.width * .016;
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const key in histories){
    const h = histories[key];
    while (h.length && (!h[0] || now - h[0].t > life)) h.shift();
    if (h.length < 3) { if (!h.length) delete histories[key]; continue; }
    for (let i = 1; i < h.length - 1; i++){
      const a = h[i-1], b = h[i], c = h[i+1]; if (!a || !b || !c) continue;
      const age = Math.min(1, (now - b.t) / life), w = base * (1 - age * .85) + 1.5, hue = colorAt(age);
      const mx1 = (a.x + b.x) / 2, my1 = (a.y + b.y) / 2, mx2 = (b.x + c.x) / 2, my2 = (b.y + c.y) / 2;
      const f = 1 - age;
      for (const [mul, al, light] of [[3.4, .10, 55], [1.9, .26, 58], [1, .85, 62], [.38, .9, 90]]){
        ctx.strokeStyle = `hsla(${hue},95%,${light}%,${al * (.35 + .65 * f)})`; ctx.lineWidth = w * mul;
        ctx.beginPath(); ctx.moveTo(mx1, my1); ctx.quadraticCurveTo(b.x, b.y, mx2, my2); ctx.stroke();
      }
    }
  }
  ctx.restore();
}

/* ===== composición del cuadro ===== */
function ajustarTamano(){
  const vw = vid.videoWidth, vh = vid.videoHeight; if (!vw || !vh) return;
  const k = Math.min(1, 1280 / Math.max(vw, vh)); const w = Math.round(vw * k / 2) * 2, h = Math.round(vh * k / 2) * 2;
  if (out.width !== w || out.height !== h){ out.width = w; out.height = h; histories = {}; smooth = {}; }
}
function dibujarFondo(){
  ctx.save();
  if (mirror){ ctx.translate(out.width, 0); ctx.scale(-1, 1); }
  ctx.drawImage(vid, 0, 0, out.width, out.height); ctx.restore();
  if (look === 1){
    ctx.globalCompositeOperation = 'saturation'; ctx.fillStyle = '#808080'; ctx.fillRect(0, 0, out.width, out.height);
    ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = 'rgba(210,205,230,1)'; ctx.fillRect(0, 0, out.width, out.height);
    const g = ctx.createLinearGradient(0, 0, 0, out.height); g.addColorStop(0, 'rgba(255,150,60,.55)'); g.addColorStop(.55, 'rgba(120,120,160,.25)'); g.addColorStop(1, 'rgba(30,70,220,.55)');
    ctx.globalCompositeOperation = 'soft-light'; ctx.fillStyle = g; ctx.fillRect(0, 0, out.width, out.height);
    ctx.globalCompositeOperation = 'source-over';
  }
}
function dibujarGrano(){
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = look === 1 ? .22 : .08;
  const ox = Math.random() * 256, oy = Math.random() * 256;
  for (let x = -ox; x < out.width; x += 256) for (let y = -oy; y < out.height; y += 256) ctx.drawImage(grain, x, y);
  ctx.restore();
}
function dibujarMarca(){
  if (!logo.complete || !logo.naturalWidth) return;
  const w = out.width * .26, h = w * logo.naturalHeight / logo.naturalWidth, m = out.width * .045;
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = out.width * .012; ctx.globalAlpha = .95;
  ctx.drawImage(logo, m, out.height - h - m, w, h); ctx.restore();
}
function dibujarEsqueleto(){
  if (!esqueleto) return;
  ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2; ctx.beginPath();
  for (const lm of lastLM) for (const [a, b] of BONES){
    const A = lm[a], B = lm[b]; if (!A || !B || A.visibility < .4 || B.visibility < .4) continue;
    const ax = (mirror ? 1 - A.x : A.x) * out.width, bx = (mirror ? 1 - B.x : B.x) * out.width;
    ctx.moveTo(ax, A.y * out.height); ctx.lineTo(bx, B.y * out.height);
  }
  ctx.stroke(); ctx.restore();
}

/* ===== loop ===== */
let recStart = 0;
function tick(now){
  requestAnimationFrame(tick);
  if (!camOk || vid.readyState < 2) return;
  ajustarTamano();
  if (pose && vid.currentTime !== lastVT){
    lastVT = vid.currentTime;
    try { const r = pose.detectForVideo(vid, performance.now()); actualizar(r.landmarks || [], now); } catch(e){}
  }
  dibujarFondo(); dibujarEstelas(now); dibujarEsqueleto(); dibujarGrano(); dibujarMarca();
  if (recorder && recorder.state === 'recording'){
    const s = Math.floor((now - recStart) / 1000); $('bRec').textContent = s + 's';
    if (s >= 60) detener();
  }
}

/* ===== captura y compartir ===== */
let recorder = null, chunks = [], resultado = null;
function mostrar(blob, nombre, tipo){
  resultado = {blob, nombre, tipo}; const url = URL.createObjectURL(blob), c = $('cont'); c.innerHTML = '';
  if (tipo.startsWith('video')){ const v = document.createElement('video'); v.src = url; v.controls = true; v.playsInline = true; v.loop = true; v.muted = true; v.autoplay = true; c.appendChild(v); }
  else { const i = document.createElement('img'); i.src = url; c.appendChild(i); }
  $('msg').textContent = ''; $('modal').style.display = 'flex';
}
$('bFoto').addEventListener('click', () => { out.toBlob(b => mostrar(b, 'campo-estela.jpg', 'image/jpeg'), 'image/jpeg', .92); });
function elegirTipo(){ for (const t of ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm']) if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t; return ''; }
function empezar(){
  const tipo = elegirTipo(); if (!window.MediaRecorder || !out.captureStream){ alert('Este navegador no puede grabar video. Probá con Safari (iPhone) o Chrome (Android).'); return; }
  chunks = []; recorder = new MediaRecorder(out.captureStream(30), tipo ? {mimeType:tipo, videoBitsPerSecond:6e6} : {videoBitsPerSecond:6e6});
  recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = () => { const mt = (recorder.mimeType || tipo || 'video/mp4').split(';')[0]; const ext = mt.includes('mp4') ? 'mp4' : 'webm';
    $('bRec').classList.remove('on'); $('bRec').textContent = 'REC'; mostrar(new Blob(chunks, {type:mt}), 'campo-estela.' + ext, mt); };
  recorder.start(250); recStart = performance.now(); $('bRec').classList.add('on');
}
function detener(){ if (recorder && recorder.state === 'recording') recorder.stop(); }
$('bRec').addEventListener('click', () => { if (recorder && recorder.state === 'recording') detener(); else empezar(); });

$('mClose').addEventListener('click', () => { $('modal').style.display = 'none'; $('cont').innerHTML = ''; resultado = null; });
$('mSave').addEventListener('click', () => {
  if (!resultado) return; const a = document.createElement('a'); a.href = URL.createObjectURL(resultado.blob); a.download = resultado.nombre; document.body.appendChild(a); a.click(); a.remove();
  $('msg').textContent = 'Si no se descargó, mantené apretada la imagen o el video y elegí "Guardar".';
});
$('mShare').addEventListener('click', async () => {
  if (!resultado) return;
  const file = new File([resultado.blob], resultado.nombre, {type:resultado.tipo});
  const datos = {files:[file], title:'CAMPO · Festival de movimiento y creatividad', text:'CAMPO · Festival de movimiento y creatividad'};
  try {
    if (navigator.canShare && navigator.canShare(datos)) await navigator.share(datos);
    else $('msg').textContent = 'Este navegador no permite compartir directo. Usá "Guardar" y subilo desde tu galería.';
  } catch(e){ if (e.name !== 'AbortError') $('msg').textContent = 'No se pudo abrir el menú de compartir. Usá "Guardar".'; }
});

/* ===== controles ===== */
$('bCam').addEventListener('click', async () => { const f = facing; facing = facing === 'user' ? 'environment' : 'user'; try { await iniciarCamara(); } catch(e){ facing = f; } });
$('bPts').addEventListener('click', () => { setI = (setI + 1) % SETS.length; $('bPts').textContent = 'Estela: ' + SETS[setI].n; histories = {}; });
$('bLen').addEventListener('click', () => { lenI = (lenI + 1) % LIFES.length; $('bLen').textContent = 'Largo: ' + LIFES[lenI].n; });
$('bLook').addEventListener('click', () => { look = 1 - look; $('bLook').textContent = 'Look: ' + (look ? 'afiche' : 'color'); });
$('bEsq').addEventListener('click', () => { esqueleto = !esqueleto; $('bEsq').textContent = 'Esqueleto: ' + (esqueleto ? 'sí' : 'no'); });

$('btn').addEventListener('click', async () => {
  $('btn').disabled = true; estado.textContent = 'Abriendo cámara…';
  try { await iniciarCamara(); } catch(e){ estado.textContent = 'No pude abrir la cámara (' + (e.name || 'error') + '). Abrí el link desde Safari o Chrome.'; $('btn').disabled = false; return; }
  estado.textContent = 'Cargando detector de cuerpo…';
  try { await cargarPose(); } catch(e){ console.warn(e); estado.textContent = 'El detector no cargó. Probá de nuevo.'; $('btn').disabled = false; return; }
  try { await navigator.wakeLock?.request('screen'); } catch(e){}
  $('inicio').remove(); $('chips').style.display = 'flex'; $('acciones').style.display = 'flex';
});
requestAnimationFrame(tick);
</script>
</body>
</html>
