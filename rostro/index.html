<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ROSTRO · PRUEBA</title>
<script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-v1.5.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
<style>
  html,body{margin:0;height:100%;background:#0b0b0d;color:#eee;font-family:system-ui,sans-serif;overflow:hidden}
  #cargando{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;
    background:#0b0b0d;font-size:14px;letter-spacing:.15em;transition:opacity .4s}
</style>
</head>
<body>
<div id="cargando">ROSTRO · PRUEBA<br><br>Abriendo cámara frontal…</div>

<a-scene mindar-face="uiLoading: no; uiScanning: no" embedded color-space="sRGB"
         renderer="colorManagement: true, physicallyCorrectLights"
         vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
  <a-camera active="false" position="0 0 0"></a-camera>

  <!-- NARIZ (punto 1) -->
  <a-entity mindar-face-target="anchorIndex: 1">
    <a-sphere radius="0.09" color="#ff2d55" material="roughness:0.6"></a-sphere>
  </a-entity>

  <!-- FRENTE (punto 10): personajito sobre la cabeza -->
  <a-entity mindar-face-target="anchorIndex: 10">
    <a-entity position="0 0.28 0.05">
      <a-sphere radius="0.22" color="#7c4dff" material="roughness:0.8"
                animation="property: position; dir: alternate; dur: 700; easing: easeInOutSine; loop: true; to: 0 0.06 0"></a-sphere>
      <a-sphere position="-0.08 0.04 0.19" radius="0.06" color="#fff"></a-sphere>
      <a-sphere position="0.08 0.04 0.19" radius="0.06" color="#fff"></a-sphere>
      <a-sphere position="-0.08 0.04 0.245" radius="0.025" color="#111"></a-sphere>
      <a-sphere position="0.08 0.04 0.245" radius="0.025" color="#111"></a-sphere>
      <a-cone position="0 0.27 0" radius-bottom="0.03" radius-top="0.0" height="0.2" color="#ffd60a"></a-cone>
    </a-entity>
  </a-entity>

  <!-- OREJAS (puntos 234 y 454): esferas de colores que sobresalen -->
  <a-entity mindar-face-target="anchorIndex: 234">
    <a-sphere radius="0.11" position="-0.05 0 0" color="#00c2ff" material="roughness:0.7"></a-sphere>
  </a-entity>
  <a-entity mindar-face-target="anchorIndex: 454">
    <a-sphere radius="0.11" position="0.05 0 0" color="#00ff88" material="roughness:0.7"></a-sphere>
  </a-entity>

  <!-- MENTÓN (punto 152) -->
  <a-entity mindar-face-target="anchorIndex: 152">
    <a-cone position="0 -0.1 0" radius-bottom="0.08" radius-top="0.0" height="0.25" rotation="180 0 0" color="#ff9f0a"></a-cone>
  </a-entity>

  <a-light type="ambient" intensity="1.1"></a-light>
  <a-light type="directional" position="0 1 1" intensity="0.8"></a-light>
</a-scene>

<script>
  document.querySelector('a-scene').addEventListener('arReady', () => {
    const c = document.getElementById('cargando');
    c.style.opacity = 0; setTimeout(() => c.remove(), 500);
  });
  document.querySelector('a-scene').addEventListener('arError', () => {
    document.getElementById('cargando').innerHTML =
      'No pude abrir la cámara.<br><br>Abrí el link desde Safari (iPhone) o Chrome (Android).';
  });
</script>
</body>
</html>
